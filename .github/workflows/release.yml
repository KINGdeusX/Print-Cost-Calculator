name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Frozen self-test
        shell: pwsh
        env:
          PCC_SELFTEST: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist\PrintCostCalculator\PrintCostCalculator.exe" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "frozen self-test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: packaging/out/PrintCostCalculator-*-windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          dnf install -y epel-release || true
          dnf config-manager --set-enabled powertools || true
          dnf install -y --setopt=skip_missing_names_on_install=True libxkbcommon-x11 xcb-util-cursor xcb-util-wm xcb-util-keysyms \
            xcb-util-image xcb-util-renderutil mesa-libGL mesa-libEGL fontconfig dbus-libs file
      - name: Create venv
        run: |
          /opt/python/cp312-cp312/bin/python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install ".[gui,dev]"
      - name: Build
        run: PYTHON=.venv/bin/python bash packaging/build_linux.sh
      - name: Frozen self-test
        env:
          PCC_SELFTEST: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          dist/PrintCostCalculator/PrintCostCalculator | tee selftest.out
          grep -q "selftest ok" selftest.out
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            packaging/out/*.AppImage
            packaging/out/*.tar.gz
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
