name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Installer
      - name: Frozen self-test
        shell: pwsh
        env:
          PCC_SELFTEST: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist\PrintCostCalculator\PrintCostCalculator.exe" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "frozen self-test failed with exit code $($p.ExitCode)" }
      - name: Installer smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $setup = Get-ChildItem "packaging\out\PrintCostCalculator-*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "setup.exe not found" }
          $dir = Join-Path $env:RUNNER_TEMP "pcc-install"
          $log = Join-Path $env:RUNNER_TEMP "pcc-setup.log"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir", "/LOG=`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log }
            throw "installer failed with exit code $($p.ExitCode)"
          }
          $exe = Join-Path $dir "PrintCostCalculator.exe"
          if (-not (Test-Path $exe)) { if (Test-Path $log) { Get-Content $log }; throw "installed exe missing" }
          $env:PCC_SELFTEST = "1"
          $p = Start-Process -FilePath $exe -Wait -PassThru
          Remove-Item Env:PCC_SELFTEST
          if ($p.ExitCode -ne 0) { throw "installed self-test failed with exit code $($p.ExitCode)" }
          $u = Start-Process -FilePath (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstaller failed with exit code $($u.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "PrintCostCalculator.exe still present after uninstall" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            packaging/out/PrintCostCalculator-*-windows-x64.zip
            packaging/out/PrintCostCalculator-*-setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        shell: bash
        run: |
          dnf install -y epel-release || true
          dnf config-manager --set-enabled powertools || true
          dnf install -y python3.12 python3.12-devel python3.12-pip
          dnf install -y libxkbcommon-x11 xcb-util-cursor xcb-util-wm xcb-util-keysyms \
            xcb-util-image xcb-util-renderutil mesa-libGL mesa-libEGL fontconfig dbus-libs file \
            xorg-x11-server-Xvfb xorg-x11-xauth
      - name: Create venv
        shell: bash
        run: |
          # Use the distro Python explicitly (/usr/bin): it ships libpython3.12.so, whereas the
          # /opt/python builds on PATH are static, which PyInstaller rejects.
          /usr/bin/python3.12 -m venv .venv
          .venv/bin/python -c "import sysconfig,sys; sys.exit(0 if sysconfig.get_config_var('Py_ENABLE_SHARED') else 1)"
          .venv/bin/pip install -U pip
          .venv/bin/pip install ".[gui,dev]"
      - name: Build
        shell: bash
        run: PYTHON=.venv/bin/python bash packaging/build_linux.sh
      - name: Check xcb platform plugin dependencies
        shell: bash
        run: |
          deps=$(ldd dist/PrintCostCalculator/_internal/PySide6/Qt/plugins/platforms/libqxcb.so)
          echo "$deps"
          if grep "not found" <<<"$deps"; then
            echo "libqxcb.so has unresolved dependencies" >&2
            exit 1
          fi
      - name: Frozen self-test
        shell: bash
        env:
          PCC_SELFTEST: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          dist/PrintCostCalculator/PrintCostCalculator | tee selftest.out
          grep -q "selftest ok" selftest.out
      - name: Frozen GUI smoke test (xcb under Xvfb)
        shell: bash
        run: xvfb-run -a env QT_QPA_PLATFORM=xcb PCC_EXIT_AFTER_SHOW=1500 dist/PrintCostCalculator/PrintCostCalculator
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            packaging/out/*.AppImage
            packaging/out/*.tar.gz
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
